plugins {
    id 'com.android.application'
    // DIKKAT: Kotlin eklentileri bilerek KULLANILMAMISTIR (0% Kotlin).
}

android {
    namespace 'com.translator.lens'
    compileSdk 34

    defaultConfig {
        applicationId "com.translator.lens"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Saf Android SDK & Bağımsız kütüphaneler (Node.js/Electron/Kotlin YOK)
    implementation 'androidx.annotation:annotation:1.7.0'
}
