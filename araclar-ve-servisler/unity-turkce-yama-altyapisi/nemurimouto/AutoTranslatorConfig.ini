[General]
Language=tr
FromLanguage=en

[Files]
Directory=Translation
OutputFile=Translation\{Lang}\Text\_AutoGeneratedTranslations.txt
PreTranslationFile=Translation\{Lang}\Text\_PreTranslations.txt
SubstitutionFile=Translation\{Lang}\Text\_Substitutions.txt
PreprocessorsFile=Translation\{Lang}\Text\_Preprocessors.txt
PostprocessorsFile=Translation\{Lang}\Text\_Postprocessors.txt

[Service]
Endpoint=GoogleTranslateV2
FallbackEndpoint=
Delay=1.0

[TextFrameworks]
EnableUGUI=True
EnableTextMeshPro=True
EnableUIElements=True
EnableNGUI=False
EnableIMGUI=True
EnableI2Loc=True

[Behaviour]
ReloadTranslationsOnFileChange=True
MaxCharactersPerTranslation=2500
IgnoreWhitespaceInDialogue=True
MinDialogueChars=1
ForceDialogueUntranslatedFirstTranslation=False
HandleRichText=True
TemplateAllNumberAway=True
OverrideFont=
FallbackFontTextMeshPro=arialbd SDF
ResizeUILine=True
WhitespaceRemovalStrategy=TrimPerNewline
RomajiPostProcessing=False
TranslationDelay=0.5

[GoogleTranslateV2]
ServiceUrl=https://translate.googleapis.com/translate_a/single
