[package]
name = "roborock_mock_server"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity Engineering"]
description = "High-performance Rust Mock Robot Server for Roborock vacuums (miIO UDP 54321 & LAN TCP 58867)"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
aes = "0.8"
cbc = { version = "0.1", features = ["block-padding", "alloc"] }
cipher = { version = "0.4", features = ["block-padding"] }
md-5 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
bytes = "1.6"
hex = "0.4"
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"

[dev-dependencies]
tokio-test = "0.4"
